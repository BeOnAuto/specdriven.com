<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: 'Hanken Grotesk', sans-serif;
}

/* ---- Dark theme (default) ---- */
body {
  --bg: #0D0D0D;
  --text: #F2F2F2;
  --secondary: #8A8A8A;
  --muted: #7A7A7A;
  --wheel: #F08422;
  --wheel2: #242424;
  --chain: #3D3D3D;
  --label-on-wheel2: #E8E8E8;
  --label-on-wheel: #0D0D0D;
  --url: #F08422;
  background: var(--bg);
  color: var(--text);
}

/* ---- Light theme ---- */
body.light {
  --bg: #FFFFFF;
  --text: #1A1A1A;
  --secondary: #6E6E6E;
  --muted: #8A8A8A;
  --wheel2: #2B2B2B;
  --chain: #C9C9C9;
  --label-on-wheel2: #F2F2F2;
  --label-on-wheel: #1A1A1A;
  --url: #D06E12;
}

.og-card {
  position: relative;
  width: 1200px;
  height: 630px;
  overflow: hidden;
}

/* Spectrum rules, top and bottom */
.spectrum {
  position: absolute;
  left: 0;
  right: 0;
  background: linear-gradient(90deg, #F2555A 0%, #F08422 30%, #C9C13F 50%, #6BBF59 72%, #4FB0E8 100%);
}

.spectrum-top { top: 0; height: 6px; }
.spectrum-bottom { bottom: 0; height: 14px; }

/* Content (text filled from ?name=&headline=&tagline= by @beonauto/og) */
.hero-content {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 0 72px 0 80px;
  height: 100%;
  gap: 60px;
}

.hero-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.hero-name {
  font-size: 84px;
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: -0.03em;
  max-width: 680px;
  margin-bottom: 28px;
}

.hero-rule {
  width: 340px;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(90deg, #F2555A, #F08422 34%, #6BBF59 72%, #4FB0E8);
  margin-bottom: 30px;
}

.hero-headline {
  font-size: 32px;
  font-weight: 400;
  line-height: 1.35;
  color: var(--secondary);
  max-width: 640px;
}

.hero-tagline {
  font-size: 23px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--muted);
  max-width: 640px;
  margin-top: 14px;
}

.hero-url {
  position: absolute;
  bottom: 44px;
  right: 72px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--url);
}

/* ChainMark explainer (hero use) */
.hero-mark {
  position: relative;
  flex: 0 0 330px;
  width: 330px;
  height: 330px;
}

.hero-mark svg {
  display: block;
  width: 330px;
  height: 330px;
  overflow: visible;
}

.mark-label {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}

.mark-label-design {
  left: 206px;
  top: 120px;
  font-size: 33px;
  color: var(--label-on-wheel2);
}

.mark-label-specs {
  left: 119px;
  top: 244px;
  font-size: 26px;
  font-weight: 500;
  color: var(--label-on-wheel);
}
</style>
</head>
<body>
<div class="og-card">
  <div class="spectrum spectrum-top" aria-hidden="true"></div>

  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-name" id="og-name">Spec-Driven Development</h1>
      <div class="hero-rule"></div>
      <p class="hero-headline" id="og-headline">Specifications are becoming a new software medium.</p>
      <p class="hero-tagline" id="og-tagline">The shift from disposable prompts to executable models.</p>
    </div>

    <div class="hero-mark">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 41.83 30.01 L 20.89 79.67 A 24 24 0 0 0 59.07 106.83 L 99.10 70.74 A 36 36 0 1 0 41.83 30.01 Z" stroke="var(--chain)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
        <g fill="var(--chain)">
          <circle cx="38.9" cy="36.96" r="1.5"/><circle cx="33.04" cy="50.85" r="1.5"/><circle cx="27.18" cy="64.74" r="1.5"/><circle cx="21.32" cy="78.64" r="1.5"/><circle cx="19.4" cy="93.35" r="1.5"/><circle cx="26.46" cy="106.39" r="1.5"/><circle cx="39.84" cy="112.79" r="1.5"/><circle cx="54.42" cy="110.11" r="1.5"/><circle cx="66.03" cy="100.55" r="1.5"/><circle cx="77.23" cy="90.45" r="1.5"/><circle cx="88.43" cy="80.36" r="1.5"/><circle cx="99.63" cy="70.26" r="1.5"/><circle cx="108.18" cy="57.97" r="1.5"/><circle cx="110.99" cy="43.27" r="1.5"/><circle cx="107.59" cy="28.7" r="1.5"/><circle cx="98.55" cy="16.77" r="1.5"/><circle cx="85.44" cy="9.55" r="1.5"/><circle cx="70.52" cy="8.28" r="1.5"/><circle cx="56.38" cy="13.19" r="1.5"/><circle cx="45.46" cy="23.42" r="1.5"/>
        </g>
        <circle cx="75" cy="44" r="30" fill="var(--wheel2)"/>
        <circle cx="43" cy="89" r="19" fill="var(--wheel)"/>
      </svg>
      <div class="mark-label mark-label-design">Design</div>
      <div class="mark-label mark-label-specs">Specs</div>
    </div>
  </div>

  <p class="hero-url">specdriven.com</p>

  <div class="spectrum spectrum-bottom" aria-hidden="true"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get('theme') === 'light') {
  document.body.classList.add('light');
}

// Card copy — supplied by @beonauto/og (`og generate`) from the homepage frontmatter.
const setText = (id, value) => { if (value) document.getElementById(id).textContent = value; };
setText('og-name', params.get('name'));
setText('og-headline', params.get('headline'));
setText('og-tagline', params.get('tagline'));

document.fonts.ready.then(() => {
  requestAnimationFrame(() => {
    window.__OG_READY = true;
  });
});
setTimeout(() => { window.__OG_READY = true; }, 5000);
</script>
</body>
</html>
